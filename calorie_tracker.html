<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calo Food Logger</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: Arial, sans-serif; margin: 0; background:#111827; color:#f9fafb; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 20px; }
    h1 { margin: 0 0 12px; font-size: 28px; }
    p { margin: 0 0 14px; color:#d1d5db; }
    .card { background:#1f2937; border:1px solid #374151; border-radius:12px; padding:16px; margin-bottom:16px; }
    label { display:block; font-weight:700; margin-bottom:8px; }
    input, select, button, textarea { width:100%; box-sizing:border-box; border-radius:8px; border:1px solid #4b5563; background:#111827; color:#f9fafb; padding:10px; }
    button { cursor:pointer; font-weight:700; background:#2563eb; border-color:#1d4ed8; }
    button.secondary { background:#374151; border-color:#4b5563; margin-top:8px; }
    button:disabled { opacity:.6; cursor:not-allowed; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .result { white-space:pre-wrap; background:#111827; border:1px dashed #4b5563; padding:10px; border-radius:8px; min-height:72px; }
    img { max-width:100%; border-radius:8px; border:1px solid #374151; margin-top:8px; }
    table { width:100%; border-collapse:collapse; margin-top:8px; font-size:14px; }
    th, td { border-bottom:1px solid #374151; text-align:left; padding:8px 6px; vertical-align:top; }
    .muted { color:#9ca3af; font-size:12px; }
    .config-toggle summary { cursor:pointer; font-weight:700; }
    .config-toggle summary:focus-visible { outline:2px solid #60a5fa; outline-offset:4px; border-radius:6px; }
    .config-body { margin-top:12px; }
    @media (max-width: 720px){ .row{ grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>📸 Calo Food Logger</h1>
    <p>Chụp ảnh món ăn hoặc bao bì sản phẩm, gửi AI để ước lượng calo rồi lưu lại nhật ký nạp vào.</p>

    <section class="card">
      <details class="config-toggle">
        <summary>Cấu hình AI</summary>
        <div class="config-body">
          <div class="row">
            <div>
              <label for="apiKey">Google AI Studio API Key</label>
              <input id="apiKey" type="password" placeholder="AIza..." autocomplete="off">
            </div>
            <div>
              <label for="model">Model</label>
              <select id="model">
                <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash Lite</option>
                <option value="gemini-3.8-flash">Gemini 3.8 Flash</option>
                <option value="gemini-3.7-flash">Gemini 3.7 Flash</option>
                <option value="gemma-4-31b-it">Gemma 4 31B</option>
              </select>
            </div>
          </div>
          <p class="muted">API key lấy từ Google AI Studio, chỉ lưu tạm trong tab hiện tại; model lưu trong trình duyệt của bạn.</p>
        </div>
      </details>
    </section>

    <section class="card">
      <label for="imageInput">Ảnh đồ ăn / bao bì</label>
      <input id="imageInput" type="file" accept="image/*" capture="environment">
      <img id="preview" alt="Xem trước ảnh" hidden>
      <button id="analyzeBtn" type="button" style="margin-top:12px;">Phân tích calo bằng AI</button>
    </section>

    <section class="card">
      <label>Kết quả phân tích gần nhất</label>
      <div id="result" class="result">Chưa có kết quả.</div>
    </section>

    <section class="card">
      <label>Nhật ký calo</label>
      <table>
        <thead>
          <tr>
            <th>Thời gian</th>
            <th>Tổng calo</th>
            <th>Chi tiết</th>
          </tr>
        </thead>
        <tbody id="logBody"></tbody>
      </table>
      <button id="clearLogBtn" type="button" class="secondary">Xóa toàn bộ nhật ký</button>
    </section>
  </div>

  <script>
    const GOOGLE_API_BASE = "https://generativelanguage.googleapis.com/v1beta";
    const MODELS = ["gemini-3.5-flash-lite", "gemini-3.8-flash", "gemini-3.7-flash", "gemma-4-31b-it"];
    const DEFAULT_MODEL = MODELS[0];
    const STORAGE_KEYS = {
      apiKey: "calo_logger_api_key",
      model: "calo_logger_model",
      logs: "calo_logger_logs"
    };

    const apiKeyInput = document.getElementById("apiKey");
    const modelInput = document.getElementById("model");
    const imageInput = document.getElementById("imageInput");
    const preview = document.getElementById("preview");
    const analyzeBtn = document.getElementById("analyzeBtn");
    const resultBox = document.getElementById("result");
    const logBody = document.getElementById("logBody");
    const clearLogBtn = document.getElementById("clearLogBtn");

    let currentImageBlob = null;
    let currentImagePreviewUrl = "";
    let logs = [];

    function normalizeModel(value) {
      const id = String(value || "").trim().replace(/^models\//i, "");
      return MODELS.includes(id) ? id : DEFAULT_MODEL;
    }

    function parseDataUrl(value) {
      const match = /^data:([^;,]+);base64,(.+)$/i.exec(String(value || ""));
      if (!match) return null;
      return {
        mimeType: match[1] || "image/jpeg",
        data: match[2]
      };
    }

    function normalizeLogEntry(value) {
      if (!value || typeof value !== "object" || Array.isArray(value)) return null;
      const parsedDate = new Date(value.timestamp);
      if (Number.isNaN(parsedDate.getTime())) return null;
      const summary = typeof value.summary === "string" && value.summary.trim()
        ? value.summary.trim()
        : "Không có chi tiết.";
      let totalCalories = "?";
      if (typeof value.totalCalories === "number" && Number.isFinite(value.totalCalories)) {
        totalCalories = value.totalCalories;
      } else if (typeof value.totalCalories === "string" && value.totalCalories.trim()) {
        totalCalories = value.totalCalories.trim();
      }
      return {
        timestamp: parsedDate.toISOString(),
        totalCalories,
        summary
      };
    }

    function normalizeAnalysisResult(value) {
      if (!value || typeof value !== "object" || Array.isArray(value)) return null;
      if (!Array.isArray(value.items)) return null;

      const totalCalories = Number(value.totalCalories);
      if (!Number.isFinite(totalCalories)) return null;

      const items = value.items.map(item => {
        if (!item || typeof item !== "object" || Array.isArray(item)) return null;
        const name = typeof item.name === "string" ? item.name.trim() : "";
        const estimatedCalories = Number(item.estimatedCalories);
        const reason = typeof item.reason === "string" ? item.reason.trim() : "";
        if (!name || !Number.isFinite(estimatedCalories) || !reason) return null;
        return { name, estimatedCalories, reason };
      });

      if (items.some(item => !item)) return null;
      if (typeof value.usedNutritionLabel !== "boolean") return null;

      return {
        totalCalories,
        items,
        usedNutritionLabel: value.usedNutritionLabel,
        confidence: ["low", "medium", "high"].includes(value.confidence) ? value.confidence : "?"
      };
    }

    function getSafeErrorDetail(errorData) {
      const code = typeof errorData?.error?.code === "string"
        ? errorData.error.code.toLowerCase()
        : (typeof errorData?.code === "string" ? errorData.code.toLowerCase() : "");
      const message = typeof errorData?.error?.message === "string"
        ? errorData.error.message.toLowerCase()
        : (typeof errorData?.message === "string" ? errorData.message.toLowerCase() : "");
      const source = `${code} ${message}`;
      if (/auth|api[_ -]?key|unauthorized|forbidden/.test(source)) return "Kiểm tra API key hoặc quyền truy cập";
      if (/rate|quota|limit/.test(source)) return "Đã vượt giới hạn sử dụng";
      if (/model/.test(source)) return "Model không hợp lệ hoặc chưa được cấp quyền";
      if (/image|payload|schema|invalid[_ -]?request/.test(source)) return "Dữ liệu gửi lên chưa hợp lệ";
      return "";
    }

    function readStoredValue(storage, key) {
      try {
        return storage.getItem(key);
      } catch {
        return null;
      }
    }

    function writeStoredValue(storage, key, value) {
      try {
        storage.setItem(key, value);
        return true;
      } catch {
        return false;
      }
    }

    function removeStoredValue(storage, key) {
      try {
        storage.removeItem(key);
      } catch {}
    }

    function loadState() {
      apiKeyInput.value = readStoredValue(sessionStorage, STORAGE_KEYS.apiKey) || "";
      modelInput.value = normalizeModel(readStoredValue(localStorage, STORAGE_KEYS.model));
      try {
        const parsedLogs = JSON.parse(readStoredValue(localStorage, STORAGE_KEYS.logs) || "[]");
        logs = Array.isArray(parsedLogs)
          ? parsedLogs.map(normalizeLogEntry).filter(Boolean)
          : [];
      } catch {
        logs = [];
      }
      renderLogs();
    }

    function saveState() {
      const apiKey = apiKeyInput.value.trim();
      if (apiKey) {
        writeStoredValue(sessionStorage, STORAGE_KEYS.apiKey, apiKey);
      } else {
        removeStoredValue(sessionStorage, STORAGE_KEYS.apiKey);
      }
      modelInput.value = normalizeModel(modelInput.value);
      writeStoredValue(localStorage, STORAGE_KEYS.model, modelInput.value);
      writeStoredValue(localStorage, STORAGE_KEYS.logs, JSON.stringify(logs));
    }

    function renderLogs() {
      logBody.replaceChildren();
      if (!logs.length) {
        const row = document.createElement("tr");
        const cell = document.createElement("td");
        cell.colSpan = 3;
        cell.className = "muted";
        cell.textContent = "Chưa có dữ liệu.";
        row.appendChild(cell);
        logBody.appendChild(row);
        return;
      }
      for (const entry of logs) {
        const row = document.createElement("tr");
        const timeCell = document.createElement("td");
        timeCell.textContent = new Date(entry.timestamp).toLocaleString("vi-VN");

        const totalCell = document.createElement("td");
        const totalStrong = document.createElement("strong");
        totalStrong.textContent = typeof entry.totalCalories === "number"
          ? `${entry.totalCalories} kcal`
          : `${entry.totalCalories ?? "?"}`;
        totalCell.appendChild(totalStrong);

        const summaryCell = document.createElement("td");
        summaryCell.textContent = entry.summary;

        row.append(timeCell, totalCell, summaryCell);
        logBody.appendChild(row);
      }
    }

    async function decodeImage(file) {
      if (typeof createImageBitmap === "function") {
        return createImageBitmap(file);
      }

      const objectUrl = URL.createObjectURL(file);
      try {
        const image = new Image();
        image.src = objectUrl;
        await image.decode();
        return image;
      } finally {
        URL.revokeObjectURL(objectUrl);
      }
    }

    async function compressImage(file) {
      const image = await decodeImage(file);
      try {
        const scale = Math.min(1, 2048 / Math.max(image.width, image.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(image.width * scale));
        canvas.height = Math.max(1, Math.round(image.height * scale));

        const context = canvas.getContext("2d");
        if (!context) throw new Error("Không thể xử lý ảnh trên thiết bị này.");
        context.drawImage(image, 0, 0, canvas.width, canvas.height);

        const blob = await new Promise((resolve, reject) => {
          canvas.toBlob(
            result => result ? resolve(result) : reject(new Error("Không thể nén ảnh.")),
            "image/jpeg",
            0.82
          );
        });
        return blob;
      } finally {
        if (typeof image.close === "function") image.close();
      }
    }

    function blobToDataUrl(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          if (typeof reader.result === "string") resolve(reader.result);
          else reject(new Error("Không đọc được ảnh đã xử lý."));
        };
        reader.onerror = () => reject(new Error("Không đọc được ảnh đã xử lý."));
        reader.readAsDataURL(blob);
      });
    }

    function safeJsonParse(text) {
      const normalized = String(text || "").trim();
      const fencedMatch = normalized.match(/```(?:json)?\s*([\s\S]*?)\s*```/i);
      const candidates = [normalized];
      if (fencedMatch) {
        candidates.unshift(fencedMatch[1].trim());
      } else if (/^```(?:json)?\s*[\s\S]*\s*```$/i.test(normalized)) {
        candidates.unshift(normalized.replace(/^```(?:json)?\s*|\s*```$/g, ""));
      }
      for (const candidate of candidates) {
        try { return JSON.parse(candidate); } catch {}
      }
      return null;
    }

    function parseGoogleResponseText(data) {
      const texts = [];
      for (const candidate of data?.candidates || []) {
        for (const part of candidate?.content?.parts || []) {
          if (typeof part?.text === "string" && part.text.trim()) {
            texts.push(part.text.trim());
            continue;
          }
          for (const key of ["json", "data"]) {
            if (part?.[key] && typeof part[key] === "object") {
              texts.push(JSON.stringify(part[key]));
              break;
            }
          }
        }
      }
      return texts.join("\n").trim();
    }

    function extractGoogleAnalysisResult(data) {
      for (const candidate of data?.candidates || []) {
        for (const part of candidate?.content?.parts || []) {
          for (const value of [part?.json, part?.data, part]) {
            const normalized = normalizeAnalysisResult(value);
            if (normalized) return normalized;
          }
        }
      }
      return normalizeAnalysisResult(safeJsonParse(parseGoogleResponseText(data)));
    }

    async function analyzeImage() {
      saveState();
      const apiKey = apiKeyInput.value.trim();
      const model = normalizeModel(modelInput.value);
      if (!apiKey) {
        resultBox.textContent = "Vui lòng nhập Google AI Studio API key.";
        return;
      }
      if (!currentImageBlob) {
        resultBox.textContent = "Vui lòng chọn ảnh trước.";
        return;
      }

      analyzeBtn.disabled = true;
      resultBox.textContent = "Đang phân tích...";
      saveState();

      const prompt = [
        "Bạn là chuyên gia dinh dưỡng.",
        "Hãy phân tích ảnh thức ăn và ước lượng calo.",
        "Nếu ảnh có bao bì sản phẩm với bảng thông tin dinh dưỡng hoặc calories, PHẢI ưu tiên đọc và dùng dữ liệu đó trước khi ước lượng bằng thị giác.",
        "Trả về JSON với cấu trúc:",
        "{",
        '  "totalCalories": number,',
        '  "items": [{"name": string, "estimatedCalories": number, "reason": string}],',
        '  "usedNutritionLabel": boolean,',
        '  "confidence": "low" | "medium" | "high"',
        "}",
        "Chỉ trả về JSON hợp lệ, không thêm văn bản khác."
      ].join("\n");

      try {
        const requestUrl = `${GOOGLE_API_BASE}/models/${encodeURIComponent(model)}:generateContent`;
        const headers = {
          "Content-Type": "application/json",
          "x-goog-api-key": apiKey
        };

        const compressedImageDataUrl = await blobToDataUrl(currentImageBlob);
        const imagePayload = parseDataUrl(compressedImageDataUrl);
        if (!imagePayload) {
          throw new Error("Ảnh chưa đúng định dạng base64 hợp lệ.");
        }

        const requestBody = {
          contents: [
            {
              role: "user",
              parts: [
                { text: prompt },
                { inlineData: { mimeType: imagePayload.mimeType, data: imagePayload.data } }
              ]
            }
          ]
        };
        // Gemma không hỗ trợ JSON mode; prompt và parser xử lý JSON cho model này.
        if (!model.startsWith("gemma")) {
          requestBody.generationConfig = { responseMimeType: "application/json" };
        }

        const response = await fetch(requestUrl, {
          method: "POST",
          headers,
          body: JSON.stringify(requestBody)
        });

        if (!response.ok) {
          let safeDetail = "";
          try {
            const errorData = await response.json();
            const message = getSafeErrorDetail(errorData);
            if (message) safeDetail = `: ${message}`;
          } catch {}
          throw new Error(`Yêu cầu AI thất bại (${response.status})${safeDetail}.`);
        }

        let data;
        try {
          data = await response.json();
        } catch {
          throw new Error("AI trả về dữ liệu không hợp lệ.");
        }
        const parsed = extractGoogleAnalysisResult(data);
        if (!parsed) {
          throw new Error("AI không trả về JSON hợp lệ theo cấu trúc mong đợi.");
        }

        const summary = (parsed.items || [])
          .map(i => `${i.name}: ${i.estimatedCalories} kcal`)
          .join("; ") || "Không có chi tiết.";
        const totalCalories = Number(parsed.totalCalories);
        const labelMsg = parsed.usedNutritionLabel ? "Có dùng thông tin từ bao bì." : "Không thấy thông tin dinh dưỡng trên bao bì.";
        resultBox.textContent = `Tổng calo: ${isFinite(totalCalories) ? totalCalories : "?"} kcal\nĐộ tin cậy: ${parsed.confidence || "?"}\n${labelMsg}\n\nChi tiết:\n${summary}`;

        logs.unshift({
          timestamp: new Date().toISOString(),
          totalCalories: isFinite(totalCalories) ? totalCalories : "?",
          summary
        });
        logs = logs.slice(0, 100);
        saveState();
        renderLogs();
      } catch (err) {
        resultBox.textContent = err instanceof Error ? err.message : "Có lỗi khi phân tích.";
      } finally {
        analyzeBtn.disabled = false;
      }
    }

    imageInput.addEventListener("change", async () => {
      const file = imageInput.files?.[0];
      if (currentImagePreviewUrl) URL.revokeObjectURL(currentImagePreviewUrl);
      currentImagePreviewUrl = "";
      currentImageBlob = null;
      if (!file) {
        preview.src = "";
        preview.hidden = true;
        resultBox.textContent = "Chưa có kết quả.";
        return;
      }
      analyzeBtn.disabled = true;
      resultBox.textContent = "Đang tối ưu ảnh...";
      try {
        currentImageBlob = await compressImage(file);
        currentImagePreviewUrl = URL.createObjectURL(currentImageBlob);
        preview.src = currentImagePreviewUrl;
        preview.hidden = false;
        resultBox.textContent = "Chưa có kết quả.";
      } catch (err) {
        currentImageBlob = null;
        preview.src = "";
        preview.hidden = true;
        resultBox.textContent = err instanceof Error ? err.message : "Không đọc được ảnh.";
      } finally {
        analyzeBtn.disabled = false;
      }
    });

    analyzeBtn.addEventListener("click", analyzeImage);
    clearLogBtn.addEventListener("click", () => {
      if (!confirm("Xóa toàn bộ nhật ký calo?")) return;
      logs = [];
      saveState();
      renderLogs();
    });

    apiKeyInput.addEventListener("change", saveState);
    apiKeyInput.addEventListener("input", saveState);
    modelInput.addEventListener("change", saveState);

    loadState();
  </script>
</body>
</html>
